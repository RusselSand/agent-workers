# SonarQube Cloud: the analysis runs in GitHub Actions (.github/workflows/sonar.yml),
# after the tests have written coverage.xml. The key is what SonarQube Cloud gives the
# repository on import; change it here if the import names it differently.
sonar.organization=russelsand
sonar.projectKey=RusselSand_agent-workers

sonar.sources=agent_workers
sonar.tests=tests
sonar.exclusions=**/__pycache__/**
sonar.test.exclusions=tests/samples/**

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
